services:
  mongodb:
    image: mongo:4.4
    container_name: mongodb
    # Running MongoDB in the background (detached)
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - mongo-backend-network
    ports:
      - "27017:27017" # Optional: Only needed if you want to access Mongo from your host machine

  node-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: node-backend:18
    container_name: node-backend-container
    restart: always
    environment:
      MONGO_URI: ${MONGO_URI}
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    networks:
      - mongo-backend-network

    # ✅ THESE TWO LINES ENABLE INTERACTIVITY
    # This allows you to attach to the backend container after it starts
    # and interact with it (e.g., if you run a shell or a program that needs input)
    tty: true
    stdin_open: true

volumes:
  mongo-data:

networks:
  mongo-backend-network:
    driver: bridge
